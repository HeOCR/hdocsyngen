[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hdocsyngen"
version = "0.0.2"
description = "Synthetic Hebrew documents with exact gold, rendered by real producers (HeOCR)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "HeOCR maintainers" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
fonts = ["fonttools==4.68.0"]
pdf = ["pdfminer.six==20260107", "pypdfium2==5.15.2", "numpy>=2", "pillow>=11"]

[project.scripts]
hdocsyngen = "hdocsyngen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hdocsyngen = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
